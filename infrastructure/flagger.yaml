apiVersion: v1
kind: Namespace
metadata:
  name: flagger-system
---
# Flagger's own lightweight Prometheus instance that scrapes NGINX metrics.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger-prometheus
  namespace: flagger-system
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flagger-system
spec:
  interval: 30m
  chart:
    spec:
      chart: flagger
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Use NGINX ingress as the traffic router / mesh provider.
    meshProvider: nginx
    # Point Flagger at the Prometheus instance above.
    metricsServer: http://flagger-prometheus.flagger-system:9090
