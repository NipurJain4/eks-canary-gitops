apiVersion: v1
kind: Namespace
metadata:
  name: flagger-system
---
# Lightweight Prometheus for Flagger to scrape NGINX metrics during canary analysis.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger-prometheus
  namespace: flagger-system
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus
      version: "25.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    # Trim to a single lightweight server for the POC.
    server:
      persistentVolume:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kube-state-metrics:
      enabled: false
    prometheus-node-exporter:
      enabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flagger-system
spec:
  interval: 30m
  chart:
    spec:
      chart: flagger
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Use NGINX ingress as the traffic router / mesh provider.
    meshProvider: nginx
    # Point Flagger at the Prometheus server (prometheus-community chart service).
    metricsServer: http://flagger-prometheus-server.flagger-system:80
