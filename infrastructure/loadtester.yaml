# Flagger load tester: generates traffic during canary analysis
# (invoked by the canary's load-test webhook).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger-loadtester
  namespace: flagger-system
spec:
  interval: 30m
  chart:
    spec:
      chart: loadtester
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
