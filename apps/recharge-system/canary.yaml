# Flagger Canary for the recharge-system static site.
# When the Deployment's image changes, Flagger shifts traffic gradually
# (10% steps to 50%), checks success-rate + latency, then promotes or rolls back.
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: recharge-system
  namespace: recharge-system
spec:
  provider: nginx
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recharge-system
  autoscalerRef:
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    name: recharge-system
  ingressRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: recharge-system
  service:
    port: 80
    targetPort: 80
  analysis:
    interval: 30s
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99
        interval: 1m
      - name: request-duration
        thresholdRange:
          max: 500
        interval: 1m
    webhooks:
      - name: load-test
        url: http://flagger-loadtester.flagger-system/
        timeout: 5s
        metadata:
          # Send load THROUGH the nginx ingress controller (with Host header) so
          # NGINX records request metrics that Flagger queries. Hitting the canary
          # service directly would bypass nginx and produce "no values found".
          cmd: "hey -z 2m -q 10 -c 2 -host recharge.example.com http://ingress-nginx-controller.ingress-nginx/"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recharge-system
  namespace: recharge-system
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    # Host required by Flagger's nginx canary analysis (metrics + traffic split).
    # Browser access still works via the NLB by sending this Host header,
    # or add it to /etc/hosts. (Flagger needs a host to manage the canary ingress.)
    - host: recharge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recharge-system
                port:
                  number: 80
