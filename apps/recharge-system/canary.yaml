# Flagger Canary for the recharge-system static site.
# When the Deployment changes, Flagger shifts traffic gradually (10% -> 50%),
# checks a custom success-rate metric, then promotes or rolls back.

# --- Custom metric template ---
# Flagger's built-in nginx query filters by label `exported_namespace`, but our
# NGINX metrics use `namespace`. This template uses the labels our metrics
# actually have, so the query returns real values (fixes "no values found").
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: nginx-success-rate
  namespace: recharge-system
spec:
  provider:
    type: prometheus
    address: http://flagger-prometheus-server.flagger-system:80
  query: |
    100 - (
      sum(
        rate(
          nginx_ingress_controller_requests{
            namespace="{{ namespace }}",
            ingress="{{ target }}",
            status!~"5.."
          }[{{ interval }}]
        )
      )
      /
      sum(
        rate(
          nginx_ingress_controller_requests{
            namespace="{{ namespace }}",
            ingress="{{ target }}"
          }[{{ interval }}]
        )
      )
      * 100
    )
    or on() vector(0)
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: recharge-system
  namespace: recharge-system
spec:
  provider: nginx
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recharge-system
  autoscalerRef:
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    name: recharge-system
  ingressRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: recharge-system
  service:
    port: 80
    targetPort: 80
  analysis:
    interval: 30s
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    metrics:
      # Custom success-rate metric (error rate must stay under 1%).
      # With 15s Prometheus scraping, a 1m window has ~4 samples for rate().
      - name: nginx-success-rate
        templateRef:
          name: nginx-success-rate
          namespace: recharge-system
        thresholdRange:
          max: 1
        interval: 1m
    webhooks:
      # Sustained load THROUGH the nginx ingress for the whole analysis window,
      # so the success-rate query always has data. Runs on each interval.
      - name: load-test
        type: rollout
        url: http://flagger-loadtester.flagger-system/
        timeout: 15s
        metadata:
          cmd: "hey -z 1m -q 15 -c 3 -host recharge.example.com http://ingress-nginx-controller.ingress-nginx/"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recharge-system
  namespace: recharge-system
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    # Host required by Flagger's nginx canary (traffic split + metric labeling).
    # For browser access without real DNS, add to /etc/hosts:
    #   <NLB_IP>  recharge.example.com
    - host: recharge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recharge-system
                port:
                  number: 80
